name: PR Preview Deploy

on:
  workflow_run:
    workflows: ["PR Sidebar Update"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy'
        required: true
        type: number

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pr-preview-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}"
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.pull_requests[0])
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PR_NUMBER=${{ inputs.pr_number }}
          else
            PR_NUMBER=${{ github.event.workflow_run.pull_requests[0].number }}
          fi
          echo "number=${PR_NUMBER}" >> $GITHUB_OUTPUT

          # PRのブランチ名を取得
          BRANCH_NAME=$(gh pr view ${PR_NUMBER} --repo ${{ github.repository }} --json headRefName --jq '.headRefName')
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}

      - name: Copy content to temp directory
        run: |
          PR_NUMBER=${{ steps.pr.outputs.number }}
          mkdir -p /tmp/pr-${PR_NUMBER}

          # .で始まるフォルダ/ファイル以外をコピー
          find . -maxdepth 1 ! -name '.' ! -name '.*' -exec cp -r {} /tmp/pr-${PR_NUMBER}/ \;

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Copy temp content to preview directory
        run: |
          PR_NUMBER=${{ steps.pr.outputs.number }}
          rm -rf pr-${PR_NUMBER}
          mkdir -p pr-${PR_NUMBER}
          cp -r /tmp/pr-${PR_NUMBER}/. pr-${PR_NUMBER}/

          # カスタムindex.htmlを生成
          cat > pr-${PR_NUMBER}/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <title>Blog - PR Preview</title>
            <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
            <meta name="description" content="PR Preview">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
          </head>
          <body>
            <div id="app"></div>
            <script>
              window.$docsify = {
                name: 'Blog (PR Preview)',
                repo: '',
                loadSidebar: true,
                loadNavbar: true,
                subMaxLevel: 2,
                basePath: '/blog/pr-PR_NUMBER_PLACEHOLDER/'
              }
            </script>
            <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
          </body>
          </html>
          EOF

          sed -i "s/PR_NUMBER_PLACEHOLDER/${PR_NUMBER}/g" pr-${PR_NUMBER}/index.html

      - name: Push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Deploy PR #${{ steps.pr.outputs.number }} preview"
          git push origin gh-pages

  call-deploy:
    needs: deploy-preview
    uses: ./.github/workflows/deploy-pages.yml

  comment-on-pr:
    runs-on: ubuntu-latest
    needs: [deploy-preview, call-deploy]
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ needs.deploy-preview.outputs.pr_number }};
            const previewUrl = `https://tttmmm4875.github.io/blog/pr-${prNumber}/`;

            // Find existing preview comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview URL')
            );

            const commentBody = `## 🚀 Preview deployed!\n\n**Preview URL:** ${previewUrl}\n\n*Deployed at: ${new Date().toISOString()}*`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }
