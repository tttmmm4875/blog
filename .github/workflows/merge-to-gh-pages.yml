name: Merge to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "merge-to-gh-pages"
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-content

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Backup PR preview directories
        run: |
          mkdir -p /tmp/pr-backups
          if ls gh-pages/pr-* 1> /dev/null 2>&1; then
            cp -r gh-pages/pr-* /tmp/pr-backups/ || true
          fi

      - name: Update gh-pages with main content
        run: |
          cd gh-pages

          # Remove all files except .git and pr-* directories
          find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name 'pr-*' -exec rm -rf {} +

          # Copy main content (exclude .git)
          rsync -av --exclude='.git' ../main-content/ ./

          # Restore PR preview directories
          if ls /tmp/pr-backups/pr-* 1> /dev/null 2>&1; then
            cp -r /tmp/pr-backups/pr-* ./ || true
          fi

      - name: Push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Update from main branch"
          git push origin gh-pages

  call-deploy:
    needs: merge
    uses: ./.github/workflows/deploy-pages.yml
