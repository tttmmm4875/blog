name: PR Sidebar Update

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: "pr-sidebar-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  update-sidebar:
    runs-on: ubuntu-latest
    # フォークからのPRはスキップ（書き込み権限がないため）
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate sidebar
        run: npm run sidebar

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to _sidebar.md"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git add _sidebar.md
            git commit -m "chore: update sidebar [skip ci]"
            git push origin ${{ github.event.pull_request.head.ref }}
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger preview deploy (no sidebar changes)
        if: steps.commit.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pr-preview-deploy.yml \
            --field pr_number=${{ github.event.pull_request.number }}
