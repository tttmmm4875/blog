name: ドキュメント追加
description: 新しいドキュメントを追加するためのIssueテンプレート
title: "[ドキュメント追加] "
body:
  - type: input
    id: instruction
    attributes:
      label: 指示
      value: "@claude 以下の指示に従ってドキュメントを追加してください"
    validations:
      required: true

  - type: input
    id: folder-path
    attributes:
      label: フォルダ構成
      description: |
        配置先フォルダのパスを入力してください。
        既存フォルダがある場合は再利用を推奨します。

        **既存フォルダ:**
        - `php/laravel/` - Laravel関連ドキュメント
        - `chrome/` - Chrome拡張機能関連
      value: "既存のフォルダ構成とファイル内容から適切なフォルダ構成を考えてください"
    validations:
      required: true

  - type: input
    id: file-name
    attributes:
      label: ファイル名
      description: ".md 形式で指定してください。変更がない場合はそのままで構いません。"
      value: "md形式でファイル内容から適切なファイル名を決めてください"
    validations:
      required: false

  - type: textarea
    id: file-content
    attributes:
      label: ファイル内容
      description: |
        ドキュメントの内容を直接記述するか、Claude Codeへの指示を入力してください。
      placeholder: |
        # ドキュメントタイトル

        ## 概要
        ここに内容を記述...

        または

        【Claude Codeへの指示】
        〇〇について調査し、以下の項目を含むドキュメントを作成してください：
        - 項目1
        - 項目2
      render: markdown
    validations:
      required: true
